[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "will-it-riscv"
version = "0.1.0"
description = "Walk a project's dependency tree and find out what will not install on riscv64 (or any other target) without building from source."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tactical Computing Labs" }]
keywords = ["riscv", "riscv64", "wheels", "packaging", "cross-platform", "dependencies", "manylinux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "packaging>=23.2",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "rich>=13.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/tactcomplabs/will-it-riscv"
Issues = "https://github.com/tactcomplabs/will-it-riscv/issues"

[project.scripts]
will-it-riscv = "will_it_riscv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/will_it_riscv"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# We support Python 3.9, where `X | None` is only safe inside annotations that
# are never evaluated at runtime. Optional[...] is the deliberate choice.
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tomli", "tomli.*", "tomllib"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
