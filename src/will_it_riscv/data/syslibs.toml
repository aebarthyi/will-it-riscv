# Mapping from a library/tool name as it appears in build files to the system
# packages that provide it. `aliases` covers the spellings found in setup.py
# `libraries=`, CMake `find_package()`, pkg-config module names and -l flags.
#
# Anything not listed here is still reported, with a guessed Debian name.

[ignore]
# CMake find_package() / meson dependency() names that are not system packages:
# they are either provided by the Python build itself, pulled from PyPI, or
# built into the toolchain.
names = [
  "python", "python2", "python3", "pythoninterp", "pythonlibs", "pythonextensions",
  "development.module", "development", "interpreter", "numpy", "cython",
  "pybind11", "nanobind", "skbuild", "scikit-build", "threads", "git", "doxygen",
  "pkgconfig", "sphinx", "catch2", "gtest", "benchmark", "googletest",
  "sanitizers", "ccache", "clang-tidy", "ipo", "lto", "filesystem", "dl", "m",
  "rt", "pthread", "c", "stdc++", "util", "nsl", "socket",
  # provided by gcc/glibc, never a separate package
  "atomic", "atomics", "quadmath", "gcc", "gcc_s", "supc++", "resolv", "anl",
  "crypt", "mvec", "execinfo", "gomp_implicit", "backtrace", "ssp",
  # Windows import libraries, common in cross-platform build files
  "synchronization", "advapi32", "ws2_32", "kernel32", "user32", "shell32",
  "bcrypt", "crypt32", "ole32", "oleaut32", "gdi32", "winmm", "iphlpapi",
  "setupapi", "msvcrt", "dbghelp", "psapi", "comdlg32", "rpcrt4", "secur32",
  "wsock32", "mincore", "pathcch", "shlwapi", "userenv", "netapi32", "mswsock",
  "winsock2", "ntdll", "powrprof", "version", "winhttp", "wininet",
  # provided by the C++ compiler itself
  "libstdcpp", "stdcpp", "stdc++fs", "cxx",
  # Vendor GPU / accelerator stacks. All are opt-in build options and none
  # has a riscv64 build, so finding them says nothing about a riscv64 build.
  "cudatoolkit", "cufft", "cufftmp", "cublas", "cusolver", "cusparse", "curand",
  "nvshmem", "nvshmem_host", "nvshmem_device", "nvml", "nvtx", "nvhpc",
  "hip", "hiprtc", "amdhip", "rocfft", "rocprim", "rocblas", "roctx", "rocm",
  "adaptivecpp", "hipsycl", "opensycl", "sycl", "mkl_sycl", "bbfft-sycl",
  "onemath", "onemkl", "onedpl", "oneapi", "dpcpp", "level_zero", "ze_loader",
  "clfft", "vkfft", "opencl", "vulkan", "torch", "torch_extension", "cp2k",
  "heffte", "mimiccommlib", "nvpl",
  # Intel VTune's ITT API and VMD's molfile plugins: opt-in, proprietary,
  # and not packaged by any distro.
  "ittnotify", "ittapi", "vmd", "xyzplugin", "vmdplugin", "molfile",
  # other language ecosystems and linters, common in polyglot CMake projects
  "java", "jni", "jvm", "ant", "flake", "flake", "pylint", "matlab", "octave",
  "halide", "openvino", "ade", "tengine", "nvcc", "cuda", "cudnn", "cublas",
  # English words that reach the scrapers through prose and CMake argument
  # lists. "library" is the dangerous one: strip its lib prefix and it
  # becomes the plausible-looking "rary".
  "library", "libraries", "the", "to", "on", "in", "of", "is", "as", "has",
  "and", "or", "not", "if", "for", "with", "this", "that", "it", "we", "need",
  "use", "used", "using", "set", "add", "all", "any", "none", "name", "names",
  "path", "paths", "dir", "dirs", "include", "includes", "version", "found",
  "native", "individual", "windows", "linux", "darwin", "unix", "default",
  "redist", "system", "systems", "static", "shared", "debug", "release",
  # C runtime and compiler support libraries: never separately installable
  "libc", "libc6", "musl", "libgcc", "libgcc_s", "libstdc", "glibc", "crypt",
  # instrumentation and sanitizers, supplied by the compiler
  "gcov", "gcov_", "asan", "ubsan", "tsan", "msan", "profiler", "coverage",
  "efence", "duma", "gen",
  # shell/build verbs and stray argument-list tokens
  "poll", "strip", "ranlib", "files", "codec", "sysinclude", "ist", "wd",
  "chardev", "migration", "qom", "hwcore", "graph", "graph_base", "redist",
  # macOS frameworks
  "accelerate", "corefoundation", "coregraphics", "appleframeworks", "objc",
  "coreservices", "foundation", "security", "systemconfiguration", "network",
  "iokit", "cocoa", "appkit", "quartz", "quartzcore", "audiotoolbox",
  "videotoolbox", "corevideo", "coremedia", "avfoundation", "opengl",
  "carbon", "diskarbitration", "metal", "metalkit", "coreaudio",
]

